name: CI

# 監査で発覚（Medium）：このリポジトリにはワークフローが一つも無く、**pushしても
# 一切検証されない**状態だった。さらに、モジュールのCoreライブラリと違って
# 他リポジトリのCIからビルドされることも無いため（全ワークフロー・Bicepを対象に
# 参照を調べた結果、このリポジトリを参照しているものは0件）、コンパイルが壊れても
# **誰も気づかない**。同種の抜けは共有ライブラリのDeliveryKit.Log、各モジュールの
# Coreライブラリでも見つかっており、その横展開として追加する。
#
# 外部プロジェクト参照を持たないため兄弟リポジトリのcheckoutもCROSS_REPO_PATも不要
# （PATの利用範囲を広げないこと自体が目的。DeliveryKit.Infraの
# docs/deployment-runbook.mdでスコープ縮小が未対応課題として挙げられている）。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 他リポジトリのワークフローと同じく最小権限（contents: readのみ）を明示する。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 監査で発覚：ジョブの実行時間に上限が無く、GitHubの既定（360分）に委ねていた。
    # このリポジトリ群は全てprivateなので、Actionsの実行時間は月の無料枠
    # （2,000分）から引かれる。ネットワーク待ちやテストのハングで1本詰まるだけで
    # **その月の枠の2割近くを1回で使い切る**。しかも詰まったジョブは失敗もせず、
    # 気づくのは枠を使い切ってから他のリポジトリのCIが動かなくなったときになる。
    # e2e.ymlには最初から30分の上限が入っていたが、他の42本へ展開されていなかった。
    # 通常は数分で終わるので、余裕を見た上限でも打ち切りの効果は変わらない。
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build（外部連携用SDK）
        run: |
          dotnet restore
          dotnet build --no-restore
