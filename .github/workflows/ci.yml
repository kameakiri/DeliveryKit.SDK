name: CI

# 監査で発覚（Medium）：このリポジトリにはワークフローが一つも無く、**pushしても
# 一切検証されない**状態だった。さらに、モジュールのCoreライブラリと違って
# 他リポジトリのCIからビルドされることも無いため（全ワークフロー・Bicepを対象に
# 参照を調べた結果、このリポジトリを参照しているものは0件）、コンパイルが壊れても
# **誰も気づかない**。同種の抜けは共有ライブラリのDeliveryKit.Log、各モジュールの
# Coreライブラリでも見つかっており、その横展開として追加する。
#
# 外部プロジェクト参照を持たないため兄弟リポジトリのcheckoutもCROSS_REPO_PATも不要
# （PATの利用範囲を広げないこと自体が目的。DeliveryKit.Infraの
# docs/deployment-runbook.mdでスコープ縮小が未対応課題として挙げられている）。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 他リポジトリのワークフローと同じく最小権限（contents: readのみ）を明示する。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 監査で発覚：ジョブの実行時間に上限が無く、GitHubの既定（360分）に委ねていた。
    # このリポジトリ群は全てprivateなので、Actionsの実行時間は月の無料枠
    # （2,000分）から引かれる。ネットワーク待ちやテストのハングで1本詰まるだけで
    # **その月の枠の2割近くを1回で使い切る**。しかも詰まったジョブは失敗もせず、
    # 気づくのは枠を使い切ってから他のリポジトリのCIが動かなくなったときになる。
    # e2e.ymlには最初から30分の上限が入っていたが、他の42本へ展開されていなかった。
    # 通常は数分で終わるので、余裕を見た上限でも打ち切りの効果は変わらない。
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Directory.Build.props の Version と CHANGELOG.md の一番上の見出しが
      # 一致していることを確かめる。片方だけ動かすと、利用者が見る番号と
      # 変更内容の説明がずれる（この2つは別の場所に書かざるを得ないので、
      # 機械で結びつける）。
      - name: Check version matches CHANGELOG
        run: |
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)
          changelog=$(grep -oPm1 '^## \K[0-9]+\.[0-9]+\.[0-9]+' DeliveryKit.SDK/CHANGELOG.md)
          echo "[check-version] Directory.Build.props=$version CHANGELOG.md=$changelog"
          if [ -z "$version" ] || [ -z "$changelog" ]; then
            echo "[check-version] どちらかからバージョンを読み取れませんでした。" >&2
            exit 1
          fi
          if [ "$version" != "$changelog" ]; then
            echo "[check-version] 一致していません。CHANGELOG.md に見出しを足してから Directory.Build.props を合わせてください。" >&2
            exit 1
          fi

      - name: Restore & Build（外部連携用SDK）
        run: |
          dotnet restore
          dotnet build --no-restore

      # **サンプルは、通るだけでは意味が無い。**
      #
      # 同じワークスペースの DeliveryKit.ConsoleTest が、ビルドされないまま
      # 3度腐った（ARCHITECTURE.md 19章）。そのうち2度は ILogger の登録漏れと
      # 必須項目が空で検証に落ちるもので、**いずれもコンパイルは通っていた。**
      # ここも直前のステップでビルドはしているが、一度も動かしていなかった。
      #
      # サンプルは外部の利用者が最初に写すものなので、
      # 動かないまま配ると、写した先で同じところに引っかかる。
      - name: Run the sample（samples/BasicDeliveryApp）
        run: dotnet run --project DeliveryKit.SDK/samples/BasicDeliveryApp

      # ログ整理ツールも起動だけ確かめる。
      #
      # **Logs フォルダが無い場所で動かす。** 対象が無ければ何も移さず何も消さずに
      # 正常終了する作りで（実際に空のディレクトリで確認済み）、ここで見たいのは
      # 「起動して最後まで進むか」だけ。消す側のロジックはこの経路では走らない。
      - name: Smoke-run the log archiver（src/DeliveryKit.LogArchiver）
        run: dotnet run --project DeliveryKit.SDK/src/DeliveryKit.LogArchiver
