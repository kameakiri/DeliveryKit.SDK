# 監査で発覚（Medium）：同じSDK/配下のDeliveryKit.ApiTemplateには設定済みなのに、
# 顧客提供物であるDeliveryKit.SDK本体だけが抜けていた（追加時の対象列挙漏れ）。
# 顧客に配布するサンプルコードが古い脆弱な依存を参照したままになるのは、
# 有料SaaSのベンダーセキュリティ評価で直接指摘されうる。
# 既存の設定と同じ最小構成（自動マージはしない。PRの内容は都度レビューする運用）。
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/DeliveryKit.SDK"
    schedule:
      interval: "weekly"
    groups:
      # **ランタイムに追従する一式は、1つのPRでまとめて上げる。**
      #
      # 別々に上がると降格（NU1605）でビルドが止まる。2026-11-15に2回踏んだ
      # （切符#36）：EF Core だけ 10.0.15 にしたら `Microsoft.Extensions.*` が
      # 10.0.12 のままで7つのCoreが落ち、`AspNetCore.OpenApi` を上げたら
      # `Microsoft.OpenApi` が 2.12.0 のままでテストが落ちた。
      #
      # **1つのPRにすれば、その形が生まれない。** 版の系統が違うものが
      # 混ざることはあるが（`Extensions.Http.Resilience` は 9.x）、
      # まとめるのはPRの単位だけなので害は無い。
      dotnet-runtime:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "Microsoft.OpenApi"
          - "System.Security.Cryptography.*"
    ignore:
      # **製品は .NET 10 に留める。** 本番リリース後2年ほどが目安
      # （2026-11-16に決定。切符#37）。.NET 11 以降の版は Dependabot にPRを出させない。
      #
      # 範囲は Dependabot の公式文書が NuGet の例に挙げている `7.*` の形で書く
      # （`>= 11` が NuGet で通るかは文書に書かれていない）。
      #
      # `update-types: version-update:semver-major` で一括に止めない理由：
      # `Microsoft.Extensions.Http.Resilience` は 9.x にいて、.NET 10 に合う
      # 10.x への上げまで止まってしまう（9.x は .NET 9 の系統で、もう更新が無い）。
      #
      # **既に開いているPRは、ここを変えても自動では閉じない**（文書に記載なし）。
      # **.NET 11 へ移るときは、この ignore を外すこと。**
      - dependency-name: "Microsoft.AspNetCore.*"
        versions: ["11.*", "12.*", "13.*"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        versions: ["11.*", "12.*", "13.*"]
      - dependency-name: "Microsoft.Extensions.*"
        versions: ["11.*", "12.*", "13.*"]
      - dependency-name: "System.Security.Cryptography.*"
        versions: ["11.*", "12.*", "13.*"]
      # Microsoft.OpenApi の版は .NET と揃っていないが、AspNetCore.OpenApi 10.x が
      # `>= 2.13.0 && < 3.0.0` を要求する（2026-11-15に NU1605 で実際に止まった）。
      # 大版を上げると必ずビルドが止まるので、大版だけ止める。
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
