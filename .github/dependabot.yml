# 監査で発覚（Medium）：同じSDK/配下のDeliveryKit.ApiTemplateには設定済みなのに、
# 顧客提供物であるDeliveryKit.SDK本体だけが抜けていた（追加時の対象列挙漏れ）。
# 顧客に配布するサンプルコードが古い脆弱な依存を参照したままになるのは、
# 有料SaaSのベンダーセキュリティ評価で直接指摘されうる。
# 既存の設定と同じ最小構成（自動マージはしない。PRの内容は都度レビューする運用）。
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/DeliveryKit.SDK"
    schedule:
      interval: "weekly"
    groups:
      # **ランタイムに追従する一式は、1つのPRでまとめて上げる。**
      #
      # 別々に上がると降格（NU1605）でビルドが止まる。2026-11-15に2回踏んだ
      # （切符#36）：EF Core だけ 10.0.15 にしたら `Microsoft.Extensions.*` が
      # 10.0.12 のままで7つのCoreが落ち、`AspNetCore.OpenApi` を上げたら
      # `Microsoft.OpenApi` が 2.12.0 のままでテストが落ちた。
      #
      # **1つのPRにすれば、その形が生まれない。** 版の系統が違うものが
      # 混ざることはあるが（`Extensions.Http.Resilience` は 9.x）、
      # まとめるのはPRの単位だけなので害は無い。
      dotnet-runtime:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "Microsoft.OpenApi"
          - "System.Security.Cryptography.*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
